name: Update README

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:
  push:
    paths:
      - 'README.md'

jobs:
  update-readme:
    name: Update README with latest metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update GitHub Stats (force refresh)
        run: |
          # This triggers a refresh of the github-readme-stats images
          # The images are cached by the service, but we can force a refresh
          echo "GitHub stats will auto-refresh on next page load"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update profile stats" && git push)